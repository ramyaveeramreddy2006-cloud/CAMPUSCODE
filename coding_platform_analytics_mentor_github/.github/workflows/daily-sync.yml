name: Daily Coding Analytics Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"  # 09:00 IST

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
          CODOLIO_API_TOKEN: ${{ secrets.CODOLIO_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python app.py --sync
      - name: Commit updated analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaderboard.json data/history.json
          git diff --cached --quiet || git commit -m "Update coding analytics"
          git push
